# DEFINICIÓN DE REFERENCIA del servicio de producción con el backend REAL. En la rama `deploy/real-remoto` este archivo se
# copia como `render.yaml`. En el repositorio principal queda como propuesta: Render solo lee `render.yaml` y no se aplica solo.
#
# SUSTITUYE el arranque del servicio existente (https://tinotify.onrender.com): el código sintético sigue en el repositorio pero
# deja de ejecutarse. No se crea un segundo servicio. Los cambios se hacen a mano en el panel (ver
# docs/despliegue-real-remoto-render.md), no por Blueprint.
#
# CONSERVADO: runtime, plan, rootDir, buildCommand, healthCheckPath, PYTHON_VERSION y --workers 1.
# CAMBIA: rama (main -> deploy/real-remoto), startCommand y variables (se retiran TINOTIFY_SR_*; se añaden
# TINOTIFY_RR_* y dos Secret Files).
#
# ROLLBACK: rama `main` (commit 4934a3f), startCommand
#   python -m uvicorn tinotify.sintetico_remoto.app:crear_app --factory --host 0.0.0.0 --port "$PORT" --workers 1 --no-proxy-headers
# y las TINOTIFY_SR_* guardadas antes del cambio.
services:
  - type: web
    name: tinotify-api                  # nombre que ya declara el render.yaml de main; el panel manda (verificar)
    runtime: python
    plan: free
    branch: deploy/real-remoto          # rama de despliegue; nunca `main`
    rootDir: backend
    autoDeployTrigger: "off"            # los push no despliegan; cada despliegue es manual
    buildCommand: python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-build.txt && python scripts/install_local.py && python -m pip check
    startCommand: python -m uvicorn tinotify.real_remoto.app:crear_app --factory --host 0.0.0.0 --port "$PORT" --workers 1 --no-proxy-headers --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.18"
      - key: TINOTIFY_RR_MODO
        value: remoto
      - key: TINOTIFY_RR_TLS
        value: proxy
      - key: TINOTIFY_RR_PROXIES_CONFIABLES
        value: privadas
      - key: TINOTIFY_RR_ACREDITACION_FILE
        value: /etc/secrets/acreditacion_sigac.json   # Secret File del panel (nunca en el repositorio)
      - key: TINOTIFY_RR_REFERENCIA_FILE
        value: /etc/secrets/referencia_portable.json   # Secret File del panel (nunca en el repositorio)
      - key: TINOTIFY_RR_TOKEN
        sync: false                                    # secreto: se escribe en el panel, no aquí
      # Opcionales (por defecto: TIPO=2, sin TOTAL_CASOS, TTL_MIN=20, MAX_LOGINS=3, VENTANA_LOGIN_MIN=15):
      #   TINOTIFY_RR_TIPO, TINOTIFY_RR_TOTAL_CASOS, TINOTIFY_RR_TTL_MIN, TINOTIFY_RR_MAX_LOGINS, TINOTIFY_RR_VENTANA_LOGIN_MIN
      # PROHIBIDAS en este servicio (no arranca): TINOTIFY_SR_*, TINOTIFY_REAL_*, SIGAC_*, SUPABASE*, PG*, DATABASE_URL.
